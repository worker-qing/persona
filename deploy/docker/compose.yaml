# Rolling-upgrade adapter: keep the project and database identities of existing deployments.
# Both environment spellings address the same containers and the same host directories.
name: ${PERSONA_COMPOSE_PROJECT:-jarvis}

services:
  hub:
    # PERSONA_IMAGE in .env (or the older JARVIS_IMAGE); with neither, compose stops: the hub has "neither an image
    # nor a build context". No `:?` inside the default: Compose before 5.0.2 evaluates a default even when its
    # variable is set, so a check there would fail installs that set only PERSONA_IMAGE.
    image: ${PERSONA_IMAGE-${JARVIS_IMAGE:-}}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # The image's own check (wget /api/v1/health) on a schedule from .env; each run makes dockerd rewrite and fsync
    # the container's state, docs/operations/docker.md "Disk writes".
    healthcheck:
      interval: ${PERSONA_HUB_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${PERSONA_HUB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${PERSONA_HUB_HEALTHCHECK_RETRIES:-3}
    logging: &logging
      driver: ${PERSONA_LOG_DRIVER:-json-file}
      options:
        max-size: "${PERSONA_LOG_MAX_SIZE:-10m}"
        max-file: "${PERSONA_LOG_MAX_FILE:-3}"
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      TZ: ${TZ:-UTC}
      PERSONA_PUBLIC_URL: ${PERSONA_PUBLIC_URL-${JARVIS_PUBLIC_URL:-}}
      JARVIS_PUBLIC_URL: ${PERSONA_PUBLIC_URL-${JARVIS_PUBLIC_URL:-}}
      PERSONA_DATABASE_URL: postgres://${PERSONA_DB_USER:-jarvis}:${PERSONA_DB_PASSWORD-${JARVIS_DB_PASSWORD:-}}@postgres:5432/${PERSONA_DB_NAME:-jarvis}?sslmode=disable
      JARVIS_DATABASE_URL: postgres://${PERSONA_DB_USER:-jarvis}:${PERSONA_DB_PASSWORD-${JARVIS_DB_PASSWORD:-}}@postgres:5432/${PERSONA_DB_NAME:-jarvis}?sslmode=disable
      PERSONA_ADMIN_ACCESS: ${PERSONA_ADMIN_ACCESS-${JARVIS_ADMIN_ACCESS:-}}
      JARVIS_ADMIN_ACCESS: ${PERSONA_ADMIN_ACCESS-${JARVIS_ADMIN_ACCESS:-}}
      PERSONA_ADMIN_CIDRS: ${PERSONA_ADMIN_CIDRS-${JARVIS_ADMIN_CIDRS:-}}
      JARVIS_ADMIN_CIDRS: ${PERSONA_ADMIN_CIDRS-${JARVIS_ADMIN_CIDRS:-}}
      PERSONA_IMAGE: ${PERSONA_IMAGE-${JARVIS_IMAGE:-}}
      JARVIS_IMAGE: ${PERSONA_IMAGE-${JARVIS_IMAGE:-}}
      PERSONA_REGISTRY_TOKEN: ${PERSONA_REGISTRY_TOKEN-${JARVIS_REGISTRY_TOKEN:-}}
      JARVIS_REGISTRY_TOKEN: ${PERSONA_REGISTRY_TOKEN-${JARVIS_REGISTRY_TOKEN:-}}
      # Where node builds for the computers' other platforms come from (a release's dl/, a mirror, or off; empty: the
      # image's own, docs/operations/docker.md "Node builds").
      PERSONA_NODE_PACKAGES: ${PERSONA_NODE_PACKAGES:-}
      # 0: the hub and the built-in manager run on personad rather than as persona-hub and persona-manager
      # (docs/operations/docker.md "Programs").
      PERSONA_SPLIT_PROGRAMS: ${PERSONA_SPLIT_PROGRAMS:-}
      # With the built-in manager in a container of its own (the manager service below): this one runs the hub alone.
      # PERSONA_BUILTIN_MANAGER: separate
    ports:
      - "${PERSONA_PORT-${JARVIS_PORT:-18660}}:18660"
      - "${PERSONA_TLS_PORT-${JARVIS_TLS_PORT:-18662}}:18662"
    volumes:
      # A single host store is visible at either image generation's state root.
      - ./data:/home/persona/.persona
      - ./data:/home/jarvis/.jarvis
      # Optional SSH keys must be mounted at the home used by the selected image.
      # - ~/.ssh:/home/persona/.ssh:ro
      # - ~/.ssh:/home/jarvis/.ssh:ro

  # The built-in manager in a container of its own, from the same image (docs/operations/docker.md "The built-in
  # manager in a container of its own"). By default it runs beside the hub in the hub's container. To move it here,
  # uncomment this service and PERSONA_BUILTIN_MANAGER above. hub.json must say "assistant": {"mode": "service"}: new
  # installs do, and docs/operations/docker.md says how to switch an older one.
  # manager:
  #   image: ${PERSONA_IMAGE-${JARVIS_IMAGE:-}}
  #   restart: unless-stopped
  #   init: true
  #   command: ["supervise", "--manager-only", "--hub", "http://hub:18660"]
  #   depends_on:
  #     hub:
  #       condition: service_healthy
  #   healthcheck:
  #     disable: true
  #   logging: *logging
  #   environment:
  #     PUID: ${PUID:-}
  #     PGID: ${PGID:-}
  #     TZ: ${TZ:-UTC}
  #     PERSONA_DATABASE_URL: postgres://${PERSONA_DB_USER:-jarvis}:${PERSONA_DB_PASSWORD-${JARVIS_DB_PASSWORD:-}}@postgres:5432/${PERSONA_DB_NAME:-jarvis}?sslmode=disable
  #     PERSONA_IMAGE: ${PERSONA_IMAGE-${JARVIS_IMAGE:-}}
  #     PERSONA_NODE_PACKAGES: ${PERSONA_NODE_PACKAGES:-}
  #     PERSONA_SPLIT_PROGRAMS: ${PERSONA_SPLIT_PROGRAMS:-}
  #   volumes:
  #     # The hub's data folder, at both paths the hub's container has it: the built-in manager keeps its files in
  #     # it as beside the hub, and the paths it writes down are the same ones there.
  #     - ./data:/home/persona/.persona
  #     - ./data:/home/jarvis/.jarvis
  #     # - ~/.ssh:/home/persona/.ssh:ro
  #     # - ~/.ssh:/home/jarvis/.ssh:ro

  postgres:
    image: ${PERSONA_POSTGRES_IMAGE-${JARVIS_POSTGRES_IMAGE:-postgres:18-alpine}}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${POSTGRES_PASSWORD:-}" ]; then
          f=/run/persona/db-password
          if [ ! -s "$$f" ] && [ -s "$${PGDATA:-/var/lib/postgresql/data}/PG_VERSION" ]; then
            echo "the database already exists but its password is missing: restore PERSONA_DB_PASSWORD or data/docker/db-password" >&2
          elif [ ! -s "$$f" ]; then
            (umask 077 && tr -dc 0-9a-f < /dev/urandom | head -c 48 > "$$f.new" && mv "$$f.new" "$$f")
            echo "first start: generated data/docker/db-password" >&2
          fi
          if [ -s "$$f" ]; then
            POSTGRES_PASSWORD="$$(cat "$$f")"
            export POSTGRES_PASSWORD
          fi
        fi
        # wal_compression=auto (the default): lz4 when this postgres takes it (15 or later, built with lz4), else off.
        # PERSONA_POSTGRES_IMAGE can name any image, and postgres does not start with a value it does not know.
        for a in "$$@"; do
          shift
          if [ "$$a" = wal_compression=auto ]; then
            a=wal_compression=off
            major=$$(postgres -V 2>/dev/null | sed -n 's/^[^0-9]*\([0-9][0-9]*\).*/\1/p')
            if [ "$${major:-0}" -ge 15 ] && pg_config --configure 2>/dev/null | grep -q -- --with-lz4; then
              a=wal_compression=lz4
            fi
          fi
          set -- "$$@" "$$a"
        done
        exec docker-entrypoint.sh "$$@"
      - postgres-entrypoint
    # PostgreSQL's own defaults unless .env says otherwise, except wal_compression (auto, which the entrypoint above
    # resolves) and checkpoint_timeout (15min; docs/operations/docker.md "Disk writes"). Settings given here win over
    # ALTER SYSTEM and postgresql.conf.
    command:
      - postgres
      - -c
      - synchronous_commit=${PERSONA_POSTGRES_SYNCHRONOUS_COMMIT:-on}
      - -c
      - wal_compression=${PERSONA_POSTGRES_WAL_COMPRESSION:-auto}
      - -c
      - checkpoint_timeout=${PERSONA_POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - wal_writer_delay=${PERSONA_POSTGRES_WAL_WRITER_DELAY:-200ms}
    logging: *logging
    environment:
      # These are persistent database identities, not product display names.
      # Installations explicitly migrated to another role/database must configure them.
      POSTGRES_USER: ${PERSONA_DB_USER:-jarvis}
      POSTGRES_DB: ${PERSONA_DB_NAME:-jarvis}
      POSTGRES_PASSWORD: ${PERSONA_DB_PASSWORD-${JARVIS_DB_PASSWORD:-}}
      TZ: ${TZ:-UTC}
    volumes:
      - ./postgres:/var/lib/postgresql
      - ./data/docker:/run/persona
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PERSONA_DB_USER:-jarvis}", "-d", "${PERSONA_DB_NAME:-jarvis}"]
      interval: ${PERSONA_POSTGRES_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${PERSONA_POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${PERSONA_POSTGRES_HEALTHCHECK_RETRIES:-30}
