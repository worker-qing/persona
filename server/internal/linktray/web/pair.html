<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
/*TOKENS*/
/*COMPONENTS*/
/* Layout only: tabs on top, then one column per mode that scrolls when the window is short. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
nav { padding: var(--space-m) var(--space-xl) 0; }
main { flex: 1; overflow-y: auto; padding: var(--space-l) var(--space-xl) var(--space-xl); }
section { display: flex; flex-direction: column; gap: var(--space-m); }
section[hidden] { display: none; }
.field-row { display: flex; gap: var(--space-s); align-items: center; }
.field-row .textbox { flex: 1; }
.end { display: flex; justify-content: flex-end; }
.group { display: flex; flex-direction: column; gap: var(--space-s); margin-top: var(--space-l); }
.address { display: flex; align-items: center; gap: var(--space-s); min-height: var(--size-control); }
.address .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.address .in-use { color: var(--positive); font-weight: var(--weight-strong); white-space: nowrap; }
details summary { list-style: none; display: inline-flex; align-items: center; gap: var(--space-xs); color: var(--text-secondary); }
details summary::-webkit-details-marker { display: none; }
details summary svg.icon { transition: transform var(--motion-normal) var(--ease-out); }
details[open] summary svg.icon { transform: rotate(90deg); }
details .textbox { margin-top: var(--space-s); }
details .ssh-body { margin-top: var(--space-s); }
details .ssh-body .textbox { margin-top: 0; }
.ssh-actions { display: flex; flex-wrap: wrap; gap: var(--space-s); align-items: center; }
.ssh-actions .spacer { flex: 1; }
</style>
</head>
<body>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main>
  <section id="active" role="tabpanel"></section>
  <section id="passive" role="tabpanel" hidden></section>
</main>
<script type="application/json" id="boot">"__BOOT__"</script>
<script>
/*COMMON*/
/*SCRIPT*/
</script>
</body>
</html>
