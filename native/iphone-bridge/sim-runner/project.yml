# The simulator backend's test runner (docs/extensions/iphone-bridge.md "Simulator backend"): a UI-test bundle
# that serves the bridge on 127.0.0.1. Self-contained: not part of apple/project.yml or CI, built only by
# native/iphone-bridge/build.sh --sim-runner, for the simulator only, without signing or a team.
name: PersonaSimRunner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SUPPORTED_PLATFORMS: iphonesimulator
    GENERATE_INFOPLIST_FILE: YES
targets:
  PersonaSimRunnerHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.persona-sim-runner.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PersonaSimRunner:
    type: bundle.ui-testing
    platform: iOS
    sources: [Runner]
    dependencies:
      - target: PersonaSimRunnerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.persona-sim-runner
        TEST_TARGET_NAME: PersonaSimRunnerHost
schemes:
  PersonaSimRunner:
    build:
      targets:
        PersonaSimRunner: [test]
    test:
      targets: [PersonaSimRunner]
